[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video2text"
version = "0.1.0"
description = "Download online videos and transcribe them locally."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "yt-dlp>=2025.1.0",
    "requests>=2.32.0",
    "huggingface-hub>=0.23.0",
    "faster-whisper==1.1.1",
    "ctranslate2>=4.4,<5",
]

[project.scripts]
video2text = "video2text.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
